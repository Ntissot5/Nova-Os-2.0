name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  # Rapide : construction Nix (tests unitaires inclus), évaluation du système, interface et accessibilité.
  verifier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Paquets Nova (tests unitaires inclus)
        run: nix build .#nova .#nova-shell -L
      - name: Le système de l'entreprise de démo s'évalue
        run: nix eval --raw .#nixosConfigurations.demo.config.system.build.toplevel.drvPath
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Interface, gestes clés et accessibilité
        run: npm run test:ui

  # Complet : une VM démarre l'entreprise, ouvre la session et vérifie le poste. Capture du bureau.
  vm:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Activer KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: system-features = nixos-test benchmark big-parallel kvm
      - name: Tests VM : poste, connecteurs réels (Dovecot, Mailpit, Radicale), export et import entre deux machines
        run: nix build .#checks.x86_64-linux.vm-demo .#checks.x86_64-linux.connecteurs-reels .#checks.x86_64-linux.portabilite -L --keep-going
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: capture-bureau
          path: result/*.png
          if-no-files-found: ignore
